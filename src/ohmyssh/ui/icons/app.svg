<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d365"/>
      <stop offset="0.55" stop-color="#d4a017"/>
      <stop offset="1" stop-color="#9a6b00"/>
    </linearGradient>
    <clipPath id="over0"><circle cx="143.1" cy="160.4" r="20.7"/></clipPath>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#background)"/>
  <!-- Two gold rings linked on a diagonal: you and the host, joined by the connection. Each ring is a dark
       rim under a gold band so the ring on top visibly cuts the one beneath. The second ring is drawn over the
       first, which covers both crossings; the clipped redraw at the end puts the first ring back on top at the
       upper crossing, and that single over/under is what makes the pair read as interlocked. -->
  <circle cx="96.3" cy="142.8" r="50" fill="none" stroke="#5c3d00" stroke-width="25"/>
  <circle cx="96.3" cy="142.8" r="50" fill="none" stroke="url(#gold)" stroke-width="18"/>
  <circle cx="159.7" cy="113.2" r="50" fill="none" stroke="#5c3d00" stroke-width="25"/>
  <circle cx="159.7" cy="113.2" r="50" fill="none" stroke="url(#gold)" stroke-width="18"/>
  <g clip-path="url(#over0)">
    <circle cx="96.3" cy="142.8" r="50" fill="none" stroke="#5c3d00" stroke-width="25"/>
    <circle cx="96.3" cy="142.8" r="50" fill="none" stroke="url(#gold)" stroke-width="18"/>
  </g>
</svg>
