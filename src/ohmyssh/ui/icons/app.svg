<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d365"/>
      <stop offset="0.55" stop-color="#d4a017"/>
      <stop offset="1" stop-color="#9a6b00"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#background)"/>
  <!-- "ohmyssh" on two lines, drawn as strokes so the logo never depends on a font being installed.
       Each line uses letter shapes with the baseline at y=0, x-height 30, ascenders 16 above, the y 16 below,
       then is scaled up and placed. -->
  <g fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(24 106) scale(1.65)">
      <circle cx="11" cy="-15" r="11"/>
      <path d="M30 -46 V0 M30 -21 a9 9 0 0 1 18 0 V0"/>
      <path d="M60 -30 V0 M60 -22 a8 8 0 0 1 16 0 V0 M76 -22 a8 8 0 0 1 16 0 V0"/>
      <path d="M104 -30 L115 -1 M124 -30 L110 16"/>
    </g>
    <g transform="translate(110 226) scale(1.65)">
      <path d="M20 -30 H7 a7.5 7.5 0 0 0 0 15 H13 a7.5 7.5 0 0 1 0 15 H0"/>
      <path d="M44 -30 H31 a7.5 7.5 0 0 0 0 15 H37 a7.5 7.5 0 0 1 0 15 H24"/>
      <path d="M52 -46 V0 M52 -21 a9 9 0 0 1 18 0 V0"/>
    </g>
  </g>
  <!-- A small gold ring beside "ssh", tilted so it reads as a band rather than a flat circle,
       with a bright highlight along the top edge and a shadow along the inside of the bottom. -->
  <ellipse cx="62" cy="190" rx="25" ry="20" fill="none" stroke="url(#gold)" stroke-width="11"/>
  <path d="M41 185 a25 20 0 0 1 42 0" fill="none" stroke="#fff6cc" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M46 196 a19 14 0 0 0 32 0" fill="none" stroke="#7a5200" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
</svg>
