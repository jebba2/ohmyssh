[project]
name = "pyommyssh"
version = "0.1.0"
description = "Python desktop GUI port of OmnySSH: an SSH client and server dashboard"
authors = [
    { name = "Jeb Barger", email = "jeb@rev-x.com" }
]
requires-python = ">=3.13"
dependencies = [
    "paramiko>=5.0.0",
    "pyside6-essentials>=6.12.0",
    "pyte>=0.8.2",
    "tomli-w>=1.2.0",
]

[project.scripts]
pyommyssh = "pyommyssh.app:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
qt_api = "pyside6"

[tool.pyright]
include = ["src", "tests", "examples", "scripts"]
typeCheckingMode = "standard"
